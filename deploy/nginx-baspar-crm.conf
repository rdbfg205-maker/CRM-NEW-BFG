# BASPAR FOAM SMART CRM — nginx Reverse Proxy + TLS (Production)
# کپی کنید:  sudo cp deploy/nginx-baspar-crm.conf /etc/nginx/sites-available/baspar-crm.conf
# سپس:      sudo ln -s ../sites-available/baspar-crm.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# نکات:
#  - مسیر گواهی‌ها (ssl_certificate) را مطابق Let's Encrypt / ACME سرور خود تنظیم کنید.
#  - app روی 127.0.0.1:3000 اجرا می‌شود (HOST=127.0.0.1 در env) — پورت 3000 فقط از localhost قابل دسترسی است.
#  - WebSocket (هاب پیام‌رسانی/نوتیفیکیشن) روی همان پورت HTTP است → بلوک upgrade در پایین الزامی است.

# rate-limit برای login (10 درخواست/۱۰ ثانیه به ازای هر IP — مکمل محدودکنندهٔ داخلی app)
limit_req_zone $binary_remote_addr zone=baspar_login:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name crm.baspar-foam.example;   # ← دامنهٔ واقعی شرکت

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.baspar-foam.example;   # ← دامنهٔ واقعی شرکت

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/crm.baspar-foam.example/fullchain.pem;   # ← مسیر واقعی
    ssl_certificate_key /etc/letsencrypt/live/crm.baspar-foam.example/privkey.pem;      # ← مسیر واقعی
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Headers امنیتی (app هم خودش می‌فرستد؛ این‌ها defense-in-depth در لبه) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # فاش‌نکردن نسخهٔ nginx
    server_tokens off;

    # حد حجم درخواست (مطابق سقف 30MB اپ برای آپلود)
    client_max_body_size 30m;

    # لاگ
    access_log /var/log/nginx/baspar-crm.access.log;
    error_log  /var/log/nginx/baspar-crm.error.log;

    # ---- Health check (برای LB/monitoring؛ rate-limit ندارد) ----
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Login: rate-limit سخت‌گیرانه‌تر در لبه ----
    location = /api/auth/login {
        limit_req zone=baspar_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- بقیهٔ API + WebSocket ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (هاب پیام‌رسانی/نوتیفیکیشن لحظه‌ای)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend (static) ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# متغیر connection_upgrade — یک‌بار در بلوک http (مثلاً /etc/nginx/nginx.conf یا بالای این فایل در context http) تعریف کنید:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# اگر در context server قرار می‌دهید، map را به سطح http منتقل کنید.
